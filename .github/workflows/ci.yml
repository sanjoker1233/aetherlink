name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  e2e:
    name: E2E (offline delivery)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install requests websocket-client cryptography
      - name: Build server
        run: go build -o /tmp/cryptserver ./cmd/server
      - name: Start server
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret-please-override-0123456789abcdef' }}
        run: |
          PORT=9091 BIND=127.0.0.1:9091 ALLOWED_ORIGINS="http://localhost:3000" \
            /tmp/cryptserver > /tmp/cryptserver.log 2>&1 &
          echo "server pid $!"
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9091/health >/dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"; cat /tmp/cryptserver.log; exit 1
      - name: Run E2E
        env:
          BASE: http://127.0.0.1:9091
          WS: ws://127.0.0.1:9091/ws
          ORIGIN: http://localhost:3000
        run: python3 test/e2e_offline.py
      - name: Stop server
        if: always()
        run: pkill -f /tmp/cryptserver || true
